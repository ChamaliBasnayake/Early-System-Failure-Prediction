# Full stack: PostgreSQL + FastAPI backend + React frontend (nginx). One command: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bgl, POSTGRES_PASSWORD: bgl, POSTGRES_DB: bgl }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bgl"], interval: 5s, timeout: 3s, retries: 20 }
  backend:
    build: { context: ., dockerfile: app/backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg2://bgl:bgl@db:5432/bgl
      MODEL_RUNS: "1:sem_final_N1_s11,5:sem_final_N5_s11,15:sem_final_N15_s11,30:sem_final_N30_s11"
    volumes:
      - ./data/interim:/srv/data/interim:ro
      - ./results:/srv/results:ro
    depends_on: { db: { condition: service_healthy } }
    ports: [ "8000:8000" ]
  frontend:
    build: { context: ./app/frontend }
    depends_on: [ backend ]
    ports: [ "8080:80" ]
volumes: { pgdata: {} }
